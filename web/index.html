  <script>
    window.hongikPwaInstall = (function () {
      // Chrome이나 Edge용 설치 프롬프트 예정.
      var deferredPrompt = null;
      // 현재 탭을 사용하다가 설치가 완료되었는지 기억.
      var installedThisSession = false;
      // Flutter에 상태 변경을 알려 줄 함수 목록.
      var listeners = new Set();
      // 브라우저에게 PWA로 열었는지 질문하는 확인 도구.
      var standaloneQuery = window.matchMedia('(display-mode: standalone)');

      // PWA 앱인지 여부.
      function isStandalone() {
        return installedThisSession ||
          standaloneQuery.matches ||
          window.navigator.standalone === true;
      }

      // 기기와 브라우저 판별.
      function detectTarget() {
        if (isStandalone()) {
          return 'installed';
        }
        if (deferredPrompt) {
          return 'nativePrompt';
        }

        var userAgent = navigator.userAgent || '';
        var platform = navigator.userAgentData?.platform || navigator.platform || '';
        var isIos = /iPad|iPhone|iPod/.test(userAgent) ||
          (platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isAndroid = /Android/i.test(userAgent);
        var isWindows = /Win/i.test(platform) || /Windows/i.test(userAgent);
        var isMac = !isIos && (/Mac/i.test(platform) || /Macintosh/i.test(userAgent));
        var isFirefox = /Firefox|FxiOS/i.test(userAgent);
        var isChromium = /Chrome|Chromium|CriOS|Edg|EdgiOS|OPR|SamsungBrowser/i.test(userAgent);
        var isSafari = /Safari/i.test(userAgent) &&
          !isChromium && !/FxiOS/i.test(userAgent);

        if (isIos) {
          return 'iosManual';
        }
        if (isMac && isSafari) {
          return 'macSafariManual';
        }
        if (isFirefox && isWindows) {
          return 'windowsFirefoxManual';
        }
        if (isAndroid) {
          return 'androidManual';
        }
        if (isChromium) {
          return 'browserManual';
        }
        return 'browserHelp';
      }

      function getStateJson() {
        return JSON.stringify({ target: detectTarget() });
      }

      function notifyListeners() {
        var state = getStateJson();
        listeners.forEach(function (listener) {
          listener(state);
        });
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        notifyListeners();
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        installedThisSession = true;
        notifyListeners();
      });

      if (standaloneQuery.addEventListener) {
        standaloneQuery.addEventListener('change', notifyListeners);
      }

      return {
        getStateJson: getStateJson,
        subscribe: function (listener) {
          listeners.add(listener);
        },
        unsubscribe: function (listener) {
          listeners.delete(listener);
        },
        prompt: function () {
          if (!deferredPrompt) {
            return Promise.resolve('unavailable');
          }

          var promptEvent = deferredPrompt;
          deferredPrompt = null;
          notifyListeners();
          try {
            promptEvent.prompt();
            return promptEvent.userChoice
              .then(function (choice) {
                return choice.outcome === 'accepted' ? 'accepted' : 'dismissed';
              })
              .catch(function () {
                return 'error';
              });
          } catch (_) {
            return Promise.resolve('error');
          }
        }
      };
    })();
  </script>

  <script>
    (function () {
      var isBlink =
        navigator.vendor === 'Google Inc.' ||
        navigator.userAgent.indexOf('Edg/') !== -1;
      if (!isBlink || typeof WebAssembly === 'undefined') {
        return;
      }

      var wasmGcProbe = new Uint8Array([
        0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0
      ]);

        canvas.getContext('webgl2') !== null ||
        canvas.getContext('webgl') !== null;
      if (!WebAssembly.validate(wasmGcProbe) || !supportsWebGl) {
        return;
      }

      var wasmPreload = document.createElement('link');
      wasmPreload.rel = 'preload';
      wasmPreload.href = 'main.dart.wasm';
      wasmPreload.as = 'fetch';
      wasmPreload.type = 'application/wasm';
      wasmPreload.crossOrigin = 'anonymous';
      document.head.appendChild(wasmPreload);

      var supportModulePreload = document.createElement('link');
      supportModulePreload.rel = 'modulepreload';
      supportModulePreload.href = 'main.dart.mjs';
      supportModulePreload.crossOrigin = 'anonymous';
      document.head.appendChild(supportModulePreload);
    })();

    :root {

    }

    @media (prefers-color-scheme: dark) {

        --boot-background: #14161B;

    /* Flutter provides button feedback; suppress browser-wide tap highlights. */
    html,
    body,
    flutter-view {
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--boot-background);
    }

    body {
      overflow: hidden;
    }

    #app-bootstrap {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: grid;
      place-items: center;
      align-items: safe center;
      padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      box-sizing: border-box;
      overflow: auto;
      background: var(--boot-background);
      color: var(--boot-text);
      font-family: "Pretendard Bootstrap", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      opacity: 1;
      transition: opacity 180ms ease;
    }

    body.flutter-loaded {
      overflow: auto;
    }

    body.flutter-loaded #app-bootstrap {
      opacity: 0;
      pointer-events: none;
    }

    .boot-content {
      width: min(280px, 100%);
      display: grid;
      justify-items: center;
      gap: 24px;

      font-size: 1.375rem;

      letter-spacing: 0;
      overflow-wrap: anywhere;

      position: absolute;
      width: 14px;
      height: 18px;
      top: -8px;
      right: -12px;
      pointer-events: none;
      animation: boot-breathe 1.6s ease-in-out infinite;

    .boot-status {

    .boot-caption {
      margin: 0;

      line-height: 1.5;

    }

    .boot-retry {
      margin-top: 12px;
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid var(--boot-secondary);
      border-radius: 14px;
      background: transparent;
      color: var(--boot-text);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
    }

    .boot-retry:focus-visible {
      outline: 2px solid var(--boot-text);
      outline-offset: 4px;
    }

    #app-bootstrap[data-state="error"] .boot-spark {
      animation: none;
    }

    @keyframes boot-breathe {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.45;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      }

        animation: none;
      }

  <div id="app-bootstrap">

      </div>
      <div class="boot-status" role="status">
        <p class="boot-caption" data-stage-app="가방에서 앱을 꺼내는 중" data-stage-engine="책상 위를 정리하는 중" data-stage-fonts="글씨 쓸 펜을 챙기는 중" data-stage-finish="책상에 앱을 펼치는 중" data-error="앱을 열지 못했어요. 다시 시도해 주세요.">가방에서 앱을 꺼내는 중</p>
      </div>
      <button class="boot-retry" type="button" hidden>다시 시도</button>
    </div>
  </div>
  <script>
    (function () {
      var bootstrap = document.getElementById('app-bootstrap');
      var caption = bootstrap.querySelector('.boot-caption');
      var retry = bootstrap.querySelector('.boot-retry');
      var finished = false;
      window.addEventListener('hongik-bootstrap-stage', function (event) {
        if (finished || bootstrap.dataset.state === 'error') return;
        var messages = {
          app: caption.dataset.stageApp,
          engine: caption.dataset.stageEngine,
          fonts: caption.dataset.stageFonts,
          finish: caption.dataset.stageFinish
        };
        if (Object.prototype.hasOwnProperty.call(messages, event.detail)) {
          caption.textContent = messages[event.detail];
        }
      });

      function showError() {
        if (finished) return;
        bootstrap.dataset.state = 'error';
        caption.textContent = caption.dataset.error;
        retry.hidden = false;
      }

      window.addEventListener('hongik-bootstrap-error', showError);
      window.addEventListener('error', function (event) {
        var target = event.target;
        if (target && target.tagName === 'SCRIPT' &&
            (target.id === 'flutter-bootstrap-script' ||
             new URL(target.src, document.baseURI).pathname.endsWith('/main.dart.js'))) {
          showError();
        }
      }, true);
      retry.addEventListener('click', function () { window.location.reload(); });
      window.addEventListener('flutter-first-frame', function () {
        finished = true;
      }, { once: true });
    })();

    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('flutter-loaded');
      window.setTimeout(function () {
        var bootstrap = document.getElementById('app-bootstrap');
        if (bootstrap) {
          bootstrap.remove();
        }
      }, 240);
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/app_service_worker.js');
      });
    }
  </script>
